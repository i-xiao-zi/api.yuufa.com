name: 视频
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  make-request:
    runs-on: ubuntu-latest
    steps:
      - name: 发起 SSE 请求并记录数据
        run: |
          curl -N https://api.yuufa.com/task/video \
               -H "Cache-Control: no-cache" \
               -H "Connection: keep-alive" \
               -H "Accept: text/event-stream" \
               | tee output.txt
          echo "SSE 数据已保存到 output.txt"
      - name: 上传数据文件作为工件
        uses: actions/upload-artifact@v4
        with:
          name: 请求记录
          path: output.txt
          # 如果文件为空，仍可上传（可选）
          if-no-files-found: warn