name: 保持仓库活跃
on:
  schedule:
    - cron: '0 0 1 * *'   # 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 使用自动生成的 GITHUB_TOKEN 进行身份验证
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 配置 Git 用户信息，用于标识这个提交是谁做的
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "xiaozi@ixiaozi.cn"

      # 3. 创建空提交并推送
      - name: Create empty commit and push
        run: |
          git commit --allow-empty -m "chore: keep repository active [$(TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S')]"
          git push